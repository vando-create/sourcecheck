server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "__CSP__" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # ES modules must be served as JavaScript
    location ~ \.mjs$ {
        types { } default_type application/javascript;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "__CSP__" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # never cache the runtime config or the page shell
    location = /config.js { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "__CSP__" always; add_header X-Content-Type-Options "nosniff" always; add_header X-Frame-Options "DENY" always; add_header Referrer-Policy "no-referrer" always; }

    # only the app's own files are served (no directory listing, no dotfiles)
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}

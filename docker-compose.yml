# SourceCheck behind Google sign-in (only @anduintransact.com accounts).
# Dokploy: create a "Compose" service from this repo and point the domain at service
# "auth", port 4180. The app container is NOT exposed directly.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      AI_ENABLED: ${AI_ENABLED:-false}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-Internal · client files stay in your browser}
    expose:
      - "80"

  auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    depends_on:
      - app
    expose:
      - "4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET (32 random bytes, base64)}
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_DOMAIN:?set APP_DOMAIN}/oauth2/callback
      # only Anduin Workspace accounts; Google is also told to show only this domain
      OAUTH2_PROXY_EMAIL_DOMAINS: anduintransact.com
      OAUTH2_PROXY_GOOGLE_GROUP: ""
      OAUTH2_PROXY_UPSTREAMS: http://app:80/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_APPROVAL_PROMPT: auto
      OAUTH2_PROXY_COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h
      OAUTH2_PROXY_COOKIE_NAME: _sourcecheck_auth
      OAUTH2_PROXY_SESSION_STORE_TYPE: cookie
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "^/healthz$"
      OAUTH2_PROXY_SHOW_DEBUG_ON_ERROR: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
